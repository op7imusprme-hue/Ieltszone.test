name: Playwright

# Manual only: the e2e flows change real data on the demo site
on:
  workflow_dispatch:
    inputs:
      project:
        description: Which tests to run
        type: choice
        options: [functional, e2e, all]
        default: functional

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IZ_EMAIL: ${{ secrets.IZ_EMAIL }}
      IZ_PASSWORD: ${{ secrets.IZ_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - name: Run tests
        run: |
          if [ "${{ inputs.project }}" = "all" ]; then npx playwright test; else npx playwright test --project=${{ inputs.project }}; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
